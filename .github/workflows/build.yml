name: "Build"
on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: build controller
        uses: ./.github/actions/run-command-with-nix-cache-upload
        with:
          aws_access_key_id: ${{ secrets.NIX_CACHE_AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.NIX_CACHE_AWS_SECRET_ACCESS_KEY }}
          signing_key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          script: timeout 5m nix build .#default --print-build-logs
  build-aarch64:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: build controller
        uses: ./.github/actions/run-command-with-nix-cache-upload
        with:
          aws_access_key_id: ${{ secrets.NIX_CACHE_AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.NIX_CACHE_AWS_SECRET_ACCESS_KEY }}
          signing_key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          script: timeout 5m nix build .#default --print-build-logs
